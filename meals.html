<!doctype html>
<html>
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Meals — SugarBuddy</title><link rel="stylesheet" href="style.css"/></head>
<body>
  <main class="container">
    <header class="page-header card"><a class="btn outline" href="dashboard.html">Back</a><h2>Meals Planner</h2><div></div></header>
    <section class="card">
      <div class="row" style="gap:8px;align-items:center">
        <select id="meals_day"></select>
        <button id="meals_load" class="btn">Load</button>
        <button id="meals_save" class="btn">Save</button>
      </div>
      <div style="margin-top:12px" id="meals_line_container"></div>
      <textarea id="meals_text" rows="6" placeholder="Edit meals for the selected day..."></textarea>
      <p class="muted">Meals shown line-by-line. Use Save to keep the template.</p>
    </section>
  </main>

  <script src="common.js"></script>
  <script>
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const sel = document.getElementById('meals_day');
    days.forEach(d=> { const o = document.createElement('option'); o.value=d; o.text=d; sel.appendChild(o); });
    sel.value = new Date().toLocaleDateString(undefined,{weekday:'long'});

    function renderLineTemplate(text){
      const cont = document.getElementById('meals_line_container');
      cont.innerHTML = '';
      const lines = (text||'').split('\n').map(l=>l.trim()).filter(Boolean);
      if(lines.length===0){ cont.innerHTML = '<div class="muted">No items yet — edit below.</div>'; return; }
      lines.forEach(line => {
        const div = document.createElement('div'); div.className='meal-line';
        div.innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png" style="width:34px;height:34px;margin-right:8px"/><div>${line}</div>`;
        cont.appendChild(div);
      });
    }

    function loadMeals(){ const u = findUserById(getCurrentUserId()); if(!u) return location.href='start.html';
      const text = u.mealsTemplate[sel.value] || '';
      document.getElementById('meals_text').value = text; renderLineTemplate(text);
    }
    document.getElementById('meals_load').addEventListener('click', loadMeals);
    document.getElementById('meals_save').addEventListener('click', ()=>{
      const id = getCurrentUserId(); const users = loadUsers(); const idx = users.findIndex(x=>x.id===id);
      users[idx].mealsTemplate[sel.value] = document.getElementById('meals_text').value;
      saveUsers(users); alert('Saved for ' + sel.value);
    });
    sel.addEventListener('change', loadMeals);
    loadMeals();
  </script>
</body>
</html>

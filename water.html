<!doctype html>
<html>
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Water — SugarBuddy</title>
  <link rel="stylesheet" href="style.css"/></head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body>
  <main class="container">
    <header class="page-header card"><a class="btn outline" href="dashboard.html">Back</a><h2>Water Tracker</h2><div></div></header>
    <section class="card">
      <p class="muted">Goal: <strong>4.0 L</strong> — track hourly or add 250 ml quickly.</p>
      <div class="row" style="gap:8px;align-items:center">
        <button id="add_glass" class="btn">+250 ml</button>
        <button id="reset_glass" class="btn outline">Reset</button>
        <div id="water_count" style="font-weight:700;font-size:18px"></div>
      </div>

      <div style="margin-top:12px">
        <h4>Hourly checkboxes</h4>
        <div id="hourChecks" class="hour-grid"></div>
      </div>
      <div id="water_bar" style="margin-top:12px"></div>
    </section>
  </main>

  <script src="common.js"></script>
  <script>
    const hours = ['04:00','05:00','06:00','07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00'];

    function renderWater(){
      const id = getCurrentUserId(); const u = findUserById(id); if(!u) return location.href='start.html';
      const tk = new Date().toISOString().slice(0,10);
      u.history[tk] = u.history[tk] || {};
      const ml = (u.history[tk].water_ml) || 0;
      document.getElementById('water_count').innerText = (ml/1000).toFixed(2) + ' L';
      const pct = Math.min(100, Math.round((ml/4000)*100));
      document.getElementById('water_bar').innerHTML = `<div class="bar" style="width:100%;background:#fff;border-radius:10px;padding:6px"><div style="width:${pct}%;background:linear-gradient(90deg,#FFB6D9,#D5B4FF);height:14px;border-radius:8px"></div></div>`;

      // hourly checks
      const container = document.getElementById('hourChecks'); container.innerHTML='';
      hours.forEach(h => {
        const ck = document.createElement('div'); ck.className='hour-check';
        const cId = 'h_' + h.replace(':','');
        const done = !!(u.history[tk] && u.history[tk].water_hours && u.history[tk].water_hours[cId]);
ck.innerHTML = `<label class="hour-label">
    <i class="fas fa-tint" style="font-size:20px;color:#4AC3FF;margin-right:8px"></i>
    ${h} <input type="checkbox" ${done? 'checked':''} />
</label>`;

        ck.querySelector('input').addEventListener('change', (e)=>{
          const users = loadUsers(); const idx = users.findIndex(x=>x.id===id);
          users[idx].history[tk] = users[idx].history[tk] || {}; users[idx].history[tk].water_hours = users[idx].history[tk].water_hours || {};
          if(e.target.checked) users[idx].history[tk].water_hours[cId] = true;
          else delete users[idx].history[tk].water_hours[cId];
          const cnt = Object.keys(users[idx].history[tk].water_hours || {}).length;
          users[idx].history[tk].water_ml = cnt * 250;
          saveUsers(users); renderWater();
        });
        container.appendChild(ck);
      });
    }

    document.getElementById('add_glass').addEventListener('click', ()=>{
      const id = getCurrentUserId(); const users = loadUsers(); const idx = users.findIndex(u=>u.id===id);
      const tk = new Date().toISOString().slice(0,10);
      users[idx].history[tk] = users[idx].history[tk] || {}; users[idx].history[tk].water_ml = (users[idx].history[tk].water_ml||0) + 250;
      saveUsers(users); renderWater();
    });

    document.getElementById('reset_glass').addEventListener('click', ()=>{
      const id = getCurrentUserId(); const users = loadUsers(); const idx = users.findIndex(u=>u.id===id);
      const tk = new Date().toISOString().slice(0,10);
      users[idx].history[tk] = users[idx].history[tk] || {}; users[idx].history[tk].water_ml = 0; users[idx].history[tk].water_hours = {};
      saveUsers(users); renderWater();
    });

    renderWater();
  </script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Calendar — SugarBuddy</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <main class="container">
    <header class="page-header card">
      <a class="btn outline" href="dashboard.html">Back</a>
      <h2>Calendar</h2>
      <div></div>
    </header>

    <section class="card">
      <div id="calendarRoot"></div>
      <p class="muted">Click any date to open that day's history.</p>
    </section>
  </main>

  <script src="common.js"></script>
  <script>

    function toDateKey(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,'0');
      const da = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${da}`;
    }

    function createCalendar(year, month){
      const root = document.createElement('div');

      const header = document.createElement('div');
      header.className = 'cal-header';

      const prevBtn = document.createElement('button');
      prevBtn.className = 'btn outline';
      prevBtn.textContent = '‹';

      const nextBtn = document.createElement('button');
      nextBtn.className = 'btn outline';
      nextBtn.textContent = '›';

      const title = document.createElement('h3');
      title.textContent = new Date(year, month, 1).toLocaleString(undefined,{ month: 'long', year:'numeric' });

      header.append(prevBtn,title,nextBtn);
      root.appendChild(header);

      const grid = document.createElement('div');
      grid.className = 'cal-grid';

      ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(w=>{
        const h=document.createElement('div');
        h.className="cal-cell cal-weekday";
        h.innerText=w;
        grid.appendChild(h);
      });

      const first = new Date(year,month,1).getDay();
      for(let i=0;i<first;i++){
        const e=document.createElement('div');
        e.className="cal-cell cal-empty";
        grid.appendChild(e);
      }

      const user = findUserById(getCurrentUserId());
      const todayKey = toDateKey(new Date());
      const days = new Date(year, month+1, 0).getDate();

      for(let d=1; d<=days; d++){
        const dd = new Date(year,month,d);
        const key = toDateKey(dd);

        const cell = document.createElement('div');
        cell.className="cal-cell cal-day";

        const num = document.createElement('div');
        num.className="day-number";
        num.textContent=d;
        cell.appendChild(num);

        if(user?.history?.[key]) cell.classList.add("has-entry");
        if(key===todayKey) cell.classList.add("today");

        cell.addEventListener('click',()=>{
          location.href = `history.html?date=${key}`;
        });

        grid.appendChild(cell);
      }

      root.appendChild(grid);

      prevBtn.onclick = ()=>renderCalendar(year, month-1);
      nextBtn.onclick = ()=>renderCalendar(year, month+1);

      return root;
    }

    function renderCalendar(y,m){
      const r=document.getElementById('calendarRoot');
      r.innerHTML='';
      r.appendChild(createCalendar(y,m));
    }

    (function init(){
      const now=new Date();
      renderCalendar(now.getFullYear(), now.getMonth());
    })();
  </script>

  <style>
    .cal-cell.today { box-shadow:0 6px 18px rgba(74,47,99,0.08); border:1px solid rgba(182,128,255,0.15); background: linear-gradient(180deg,#fff,#FFF8FF); }
    .cal-cell.has-entry { box-shadow:0 6px 14px rgba(0,0,0,0.04); border:1px solid rgba(182,128,255,0.12); }
    .cal-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:10px; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
    .cal-cell { padding:10px;border-radius:8px;min-height:58px;display:flex;flex-direction:column; }
    .cal-weekday { font-weight:700;color:var(--muted); }
    .day-number{ font-weight:700; }
  </style>

</body>
</html>
